services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fontspace
      POSTGRES_USER: fontspace
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fontspace_local_password}
    volumes:
      - fontspace_db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fontspace -d fontspace"]
      interval: 5s
      timeout: 3s
      retries: 15
  web-service:
    build: ./web-service
    environment:
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://fontspace:${DB_PASSWORD:-fontspace_local_password}@db:5432/fontspace
      FONT_SERVICE_URL: http://web-service:8001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
volumes:
  fontspace_db:
